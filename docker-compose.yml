services:
  db:
    image: postgres:latest
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "${DBUSER}"
      POSTGRES_DB: "${DBNAME}"
      POSTGRES_PASSWORD: "${DBPASS}"
    ports:
      - '5432:5432'
    networks:
      - postgres-network

volumes:
  postgres-data:


networks:
  postgres-network:
    driver: bridge
